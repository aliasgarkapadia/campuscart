events {}
http {
  upstream campuscart {
    server api1:8080 max_fails=1 fail_timeout=10s;
    server api2:8080 max_fails=1 fail_timeout=10s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://campuscart;
      proxy_next_upstream error timeout http_500 http_502 http_503;
      proxy_connect_timeout 2s;
    }
  }
}