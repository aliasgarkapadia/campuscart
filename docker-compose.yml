services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campuscart
      POSTGRES_USER: campuscart
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [orders-data:/var/lib/postgresql/data]

  api1: &api
    image: campuscart-api:${API_TAG:-1.0.1}
    environment:
      DB_HOST: db
      DB_NAME: campuscart
      DB_USER: campuscart
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    depends_on: [db]

  api2: *api

  proxy:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api1, api2]

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  orders-data: